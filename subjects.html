<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudyHub — Subjects</title>
  <link rel="icon" type="image/svg+xml" href="public/favicon.svg" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/layout.css" />
</head>
<body data-page="subjects">

  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <div class="app">
    <!-- ══ SIDEBAR ══ -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <div class="sidebar-logo-icon">S</div>
        <span>StudyHub</span>
      </div>
      <nav class="sidebar-nav">
        <a href="index.html" class="sidebar-link" data-page="dashboard">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" /></svg>
          Dashboard
        </a>
        <a href="subjects.html" class="sidebar-link" data-page="subjects">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12.75V12A2.25 2.25 0 0 1 4.5 9.75h15A2.25 2.25 0 0 1 21.75 12v.75m-8.69-6.44-2.12-2.12a1.5 1.5 0 0 0-1.061-.44H4.5A2.25 2.25 0 0 0 2.25 6v12a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9a2.25 2.25 0 0 0-2.25-2.25h-5.379a1.5 1.5 0 0 1-1.06-.44Z" /></svg>
          Subjects
        </a>
        <a href="favorites.html" class="sidebar-link" data-page="favorites">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z" /></svg>
          Favorites
        </a>
        <a href="search.html" class="sidebar-link" data-page="search">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" /></svg>
          Search
        </a>
      </nav>
      <p class="sidebar-section-title">YOUR SUBJECTS</p>
      <div class="sidebar-subject-list" id="sidebar-subjects-list"></div>
      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="sidebar-user-avatar" id="sidebar-user-initial">Y</div>
          <span class="sidebar-user-name" id="sidebar-user-name">Your Name</span>
        </div>
        <button class="theme-toggle" id="theme-toggle" title="Toggle theme"><span id="theme-icon"></span></button>
      </div>
    </aside>

    <!-- ══ MAIN CONTENT ══ -->
    <main class="main">
      <div class="topbar">
        <div class="topbar-logo">
          <div class="sidebar-logo-icon">S</div>
          StudyHub
        </div>
        <button class="hamburger" id="hamburger-btn" title="Open menu">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" /></svg>
        </button>
      </div>

      <div class="page">
        <div class="page-header fade-in">
          <h1>All Subjects</h1>
          <p>Select a subject to view its units and resources.</p>
        </div>
        <!-- Rendered by subjects.js -->
        <div class="subjects-grid" id="subjects-grid">
          <div class="skeleton" style="height:200px;border-radius:14px"></div>
          <div class="skeleton" style="height:200px;border-radius:14px;animation-delay:.07s"></div>
          <div class="skeleton" style="height:200px;border-radius:14px;animation-delay:.14s"></div>
          <div class="skeleton" style="height:200px;border-radius:14px;animation-delay:.21s"></div>
          <div class="skeleton" style="height:200px;border-radius:14px;animation-delay:.28s"></div>
          <div class="skeleton" style="height:200px;border-radius:14px;animation-delay:.35s"></div>
          <div class="skeleton" style="height:200px;border-radius:14px;animation-delay:.42s"></div>
        </div>
      </div>
    </main>
  </div>

  <div id="toast-container"></div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/subjects.js"></script>
</body>
</html>
